ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /wheel/odometry
    # TrackedVehicle publishes a pose with zero covariance, which falsely says
    # the pose is exact. Use only measured forward velocity from the tracks.
    odom0_config: [false, false, false, false, false, false, true, false, false, false, false, false, false, false, false]
    odom0_differential: false
    imu0: /imu/data
    # Gazebo provides a world-referenced simulated orientation plus a noisy
    # angular rate. Use both to prevent integrated gyro drift from rotating SLAM.
    imu0_config: [false, false, false, false, false, true, false, false, false, false, false, true, false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    print_diagnostics: true
